# Server Configuration
spring.main.banner-mode=off
server.port=9082
spring.application.name=yms-kafka-api

# Kafka Configuration
#spring.kafka.bootstrap-servers=nssmesk01:9092;nssmesk02:9092;nssmesk03:9092
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Kafka Consumer Configuration
kafka.consumer.group-id=yms-truck-assignment-consumer
kafka.consumer.auto-offset-reset=earliest
kafka.consumer.enable-auto-commit=false
kafka.consumer.max-poll-records=10
kafka.consumer.session-timeout-ms=30000

# Jackson Configuration - Datum/Zeit als String serialisieren
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.deserialization.read-date-timestamps-as-nanoseconds=false

# Kafka Topics
kafka.topics.delivery=RHW.YMS.DELIVERY
kafka.topics.weighing-in=RHW.YMS.WEIGHING.IN
kafka.topics.weighing-out=RHW.YMS.WEIGHING.OUT
kafka.topics.truck-assignment=RHW.YMS.TRUCK.ASSIGNMENT
kafka.topics.wiegedaten=RHW.YMS.WIEGEDATEN

# PAARI REST API Configuration
yms.api.base-url=http://10.72.87.101:5699 
yms.api.truck-assignment-endpoint=/paari/lkwEinweisen
yms.api.connection-timeout-ms=5000
yms.api.read-timeout-ms=10000
yms.api.retry.max-attempts=3
yms.api.retry.delay-ms=1000

# PAARI API Authentication (optional)
yms.api.auth.enabled=false
yms.api.auth.token=

# Validation Configuration - Ein-/Ausschaltbar pro Feld
yms.validation.enabled=true
yms.validation.delivery.ymsReference=true
yms.validation.delivery.plannedDeliveryDate=true
yms.validation.delivery.plannedDeliveryTime=true
yms.validation.delivery.plannedWeightKg=true
yms.validation.delivery.targetLocation=true
yms.validation.delivery.materialType=true
yms.validation.delivery.supplier=true
yms.validation.delivery.isWarehouse=true
yms.validation.delivery.isExternalWarehouse=true

# Logging - Konfiguration in logback-spring.xml